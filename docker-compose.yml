version: "2.1"

volumes:
  ha-storage:
  browser-settings:
  # Wayland socket, shared by the display (compositor) and browser blocks.
  display-socket:

services:
  homeassistant:
    build: ./homeassistant
    network_mode: host
    restart: always
    volumes:
      # Only .storage persists (users, onboarding). Config ships in the image.
      - ha-storage:/config/.storage

  # Weston compositor; Dockerfile.template picks the image for the fleet arch.
  display:
    build: ./display
    network_mode: host
    privileged: true
    restart: always
    volumes:
      - display-socket:/run
    labels:
      io.balena.features.dbus: "1"

  # Browser block v3 (Wayland), built from source: the browser submodule is
  # pinned to balenasolutions/browser#207. v3 images are not published yet.
  browser:
    build: ./browser
    network_mode: host
    privileged: true
    restart: always
    depends_on:
      - display
      - homeassistant
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - display-socket:/run
      - browser-settings:/data
    environment:
      XDG_RUNTIME_DIR: /run/user/0
      WAYLAND_DISPLAY: wayland-0
      LAUNCH_URL: http://localhost:8123/exein-demo/home
      KIOSK: "1"

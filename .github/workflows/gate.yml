name: Exein gate (reusable)

# Finalizes draft releases from build-scan-draft.yml once their Exein scans pass.
# The caller supplies the trigger, for example a schedule.
on:
  workflow_call:
    inputs:
      fleet:
        description: balenaCloud fleet slug, for example myorg/myfleet
        type: string
        required: true
      fail-on:
        description: 'Lowest severity that blocks a release: critical or high'
        type: string
        default: critical
      enforce:
        description: false finalizes failing drafts and tags them override
        type: boolean
        default: true
      balena-cli-version:
        type: string
        default: v25.2.6
      analyzer-url:
        type: string
        default: https://analyzer.exein.io/api/
      analyzer-cli-version:
        type: string
        default: latest
    secrets:
      balena-token:
        required: true
      analyzer-api-key:
        required: true

env:
  RESULTS_DIR: exein-results

jobs:
  gate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    concurrency:
      group: balena-exein-gate-${{ inputs.fleet }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-balena
        with:
          token: ${{ secrets.balena-token }}
          version: ${{ inputs.balena-cli-version }}

      - uses: ./.github/actions/setup-analyzer
        with:
          api-key: ${{ secrets.analyzer-api-key }}
          api-url: ${{ inputs.analyzer-url }}
          version: ${{ inputs.analyzer-cli-version }}

      - uses: ./.github/actions/release-gate
        with:
          fleet: ${{ inputs.fleet }}
          fail-on: ${{ inputs.fail-on }}
          enforce: ${{ inputs.enforce }}
          api-key: ${{ secrets.analyzer-api-key }}
          api-url: ${{ inputs.analyzer-url }}
          results-dir: ${{ env.RESULTS_DIR }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: balena-exein-gate-results
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: ignore

name: Build, scan, deploy draft

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: shaunmulligan/balena-exein/.github/workflows/build-scan-draft.yml@main
    with:
      # One app, two device types. Add a fleet here and in exein-gate.yml.
      fleets: |
        PI5_FLEET_SLUG
        X86_FLEET_SLUG
    secrets:
      balena-token: ${{ secrets.BALENA_TOKEN }}
      analyzer-api-key: ${{ secrets.ANALYZER_API_KEY }}

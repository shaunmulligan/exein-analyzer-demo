name: Build, scan, deploy draft

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan-draft:
    uses: ./.github/workflows/build-scan-draft.yml
    with:
      fleet: ${{ vars.BALENA_FLEET }}
      device-type: raspberrypi5
      arch: aarch64
    secrets:
      balena-token: ${{ secrets.BALENA_TOKEN }}
      analyzer-api-key: ${{ secrets.ANALYZER_API_KEY }}
